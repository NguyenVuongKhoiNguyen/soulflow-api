# Shared test settings.
API_CONTAINER_PORT=8080
app.cors.allowed-origins=*
spring.ai.ollama.base-url=http://localhost:11434
spring.mail.host=localhost
app.account-seeding.enabled=false
app.cart-seeding.enabled=false
app.catalog-seeding.enabled=false
app.comment-reply-seeding.enabled=false
app.discount-seeding.enabled=false
app.order-seeding.enabled=false

# In-memory simple cache for tests
spring.cache.type=simple

# In-memory H2 database for testing
spring.flyway.enabled=false
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
