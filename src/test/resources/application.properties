# Shared test settings. The active Docker integration-test environment supplies
# SQL Server connection properties through docker-compose.yml.
API_CONTAINER_PORT=8080
app.cors.allowed-origins=*
spring.ai.ollama.base-url=http://localhost:11434
spring.mail.host=localhost
app.account-seeding.enabled=false
app.cart-seeding.enabled=false
app.catalog-seeding.enabled=false
app.comment-reply-seeding.enabled=false
app.discount-seeding.enabled=false
app.order-seeding.enabled=false

# Integration tests do not need the external Redis cache.  Use Spring's
# in-memory cache so cacheable services and cache warmup remain testable.
spring.cache.type=simple
