spring.application.name=FlowerShop
spring.main.allow-circular-references=true

server.port=${API_CONTAINER_PORT}

app.cors.allowed-origins=${FRONTEND_URL}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

minio.url=${MINIO_URL}
minio.public-url=${MINIO_PUBLIC_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=flower-shop

app.account-seeding.enabled=${ACCOUNT_SEEDING_ENABLED:true}
app.account-seeding.default-password=${ACCOUNT_SEEDING_DEFAULT_PASSWORD:password}

app.catalog-seeding.enabled=${CATALOG_SEEDING_ENABLED:true}
app.catalog-seeding.default-price=${CATALOG_SEEDING_DEFAULT_PRICE:100000}
app.catalog-seeding.default-quantity=${CATALOG_SEEDING_DEFAULT_QUANTITY:10}

app.comment-reply-seeding.enabled=${COMMENT_REPLY_SEEDING_ENABLED:true}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_CONTAINER_PORT}
spring.data.redis.password=
spring.data.redis.repositories.enabled=false

spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.shutdown-timeout=100ms

spring.ai.model.chat=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL}
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL:qwen2.5:0.5b}
spring.ai.ollama.init.pull-model-strategy=never

spring.mvc.async.request-timeout=${AI_REQUEST_TIMEOUT:125s}

app.ai.executor.core-pool-size=${AI_EXECUTOR_CORE_POOL_SIZE:2}
app.ai.executor.max-pool-size=${AI_EXECUTOR_MAX_POOL_SIZE:4}
app.ai.executor.queue-capacity=${AI_EXECUTOR_QUEUE_CAPACITY:20}

app.filter.executor.core-pool-size=${FILTER_EXECUTOR_CORE_POOL_SIZE:2}
app.filter.executor.max-pool-size=${FILTER_EXECUTOR_MAX_POOL_SIZE:4}
app.filter.executor.queue-capacity=${FILTER_EXECUTOR_QUEUE_CAPACITY:50}

app.osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
app.nominatim.base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.cors.allowed-origins=${FRONTEND_URL} 

spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms

