services:

  redis:
    image: redis:latest
    container_name: redis-cache
    command:
      - redis-server
      - --maxmemory
      - "${REDIS_MAXMEMORY:-256mb}"
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_PORT}:${REDIS_CONTAINER_PORT}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: minio-image-storage
    ports:
      - "${MINIO_PORT}:${MINIO_CONTAINER_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_CONTAINER_PORT}"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "${MINIO_PUBLIC_URL}/minio/health/live"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-ai
    ports:
      - "${OLLAMA_PORT}:${OLLAMA_CONTAINER_PORT}"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "${OLLAMA_BASE_URL}"
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_CHAT_MODEL}"]
    restart: "no"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DB_PORT}:${DB_CONTAINER_PORT}"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./init:/init
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "${DB_PASSWORD}",
          "-C",
          "-Q",
          "SELECT 1"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    entrypoint:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd
        -S sqlserver
        -U sa
        -P "$${MSSQL_SA_PASSWORD}"
        -C
        -Q "IF DB_ID(N'flower_shop') IS NULL CREATE DATABASE [flower_shop];"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: flower-shop-api
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      API_CONTAINER_PORT: "${API_CONTAINER_PORT}"

      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"

      DB_PASSWORD: "${DB_PASSWORD}"

      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"

      REDIS_HOST: "${REDIS_HOST}"
      REDIS_CONTAINER_PORT: "${REDIS_CONTAINER_PORT}"

      MINIO_URL: "${MINIO_URL}"
      MINIO_PUBLIC_URL: "${MINIO_PUBLIC_URL}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"

      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL}"
      OLLAMA_CHAT_MODEL: "${OLLAMA_CHAT_MODEL}"

      FRONTEND_URL: "${FRONTEND_URL}"

      SEPAY_WEBHOOK_API_KEY: "${SEPAY_WEBHOOK_API_KEY}"
      SEPAY_ACCOUNT_NUMBER: "${SEPAY_ACCOUNT_NUMBER}"


      ACCOUNT_SEEDING_ENABLED: "${ACCOUNT_SEEDING_ENABLED}"
      ACCOUNT_SEEDING_DEFAULT_PASSWORD: "${ACCOUNT_SEEDING_DEFAULT_PASSWORD}"
      CATALOG_SEEDING_ENABLED: "${CATALOG_SEEDING_ENABLED}"
      COMMENT_REPLY_SEEDING_ENABLED: "${COMMENT_REPLY_SEEDING_ENABLED}"

    dns:
      - 1.1.1.1
      - 8.8.8.8

    ports:
      - "${API_PORT}:${API_CONTAINER_PORT}"

    volumes:
      - .:/app
      - maven_cache:/root/.m2

    restart: unless-stopped

  frontend:
    build:
      context: ../flowershop
      dockerfile: Dockerfile.dev

    container_name: flower-shop-frontend

    ports:
      - "${FRONTEND_PORT}:${FRONTEND_CONTAINER_PORT}"

    environment:
      API_URL: "${API_URL}"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"

      NEXT_PUBLIC_MINIO_URL: "${NEXT_PUBLIC_MINIO_URL}"
      MINIO_INTERNAL_URL: "${MINIO_INTERNAL_URL}"

      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

    volumes:
      - ../flowershop:/app
      - /app/node_modules
      - /app/.next

    depends_on:
      - api

    restart: unless-stopped

volumes:
  redis_data:
  minio_data:
  ollama_data:
  sqlserver_data:
  maven_cache:









